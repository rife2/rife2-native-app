name: bld-ci

on: [push, pull_request, workflow_dispatch]

jobs:
  # the native libraries are only built on a Mac
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: extension

    strategy:
      matrix:
        java-version: [ 17, 21, 25, 26 ]

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 0

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v6
        with:
          distribution: 'corretto'
          java-version: ${{ matrix.java-version }}
          check-latest: true

      - name: Compile source
        run: ./bld clean download compile

      - name: Run tests
        run: ./bld test

  build-swift:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 0

      - name: Build the Swift package for macOS
        run: swift build

      - name: Build the Swift package for iOS
        run: swift build --triple arm64-apple-ios17.0 --sdk "$(xcrun --sdk iphoneos --show-sdk-path)"

      - name: Compile the classes for Android
        run: |
          platform=$(ls -d "$ANDROID_HOME"/platforms/android-* | sort -V | tail -1)
          curl -sfL -o webkit.aar https://dl.google.com/android/maven2/androidx/webkit/webkit/1.12.1/webkit-1.12.1.aar
          echo "18a0a51ad129e0c8563f031d46c8a7e61169f56ae84e562a0d75686941262111  webkit.aar" | shasum -a 256 -c -
          unzip -o -q webkit.aar classes.jar -d build/webkit
          javac --release 17 -cp "$platform/android.jar:build/webkit/classes.jar" -d build/android android/src/rife/nativeapp/android/*.java checks/android/src/rife/nativeapp/check/MainActivity.java
