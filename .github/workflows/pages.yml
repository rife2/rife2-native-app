name: javadocs-pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'corretto'
          java-version: 17

      - name: Build Javadocs
        run: |
          ./bld clean download compile javadoc
          (cd extension && ./bld clean download compile javadoc)
          cp -R extension/build/javadoc build/javadoc/extension

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/javadoc/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
