name: publish

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: macos-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'corretto'
          java-version: 17

      - name: Import key
        run: echo "${{ secrets.SIGN_SECRET_KEY }}" | gpg --batch --import

      - name: Publish
        working-directory: extension
        run: >-
          ./bld clean download compile test publish
          -Dbld.repo.rife2-snapshots=https://repo.rife2.com/snapshots/
          -Dbld.repo.rife2-snapshots.username=${{ secrets.RIFE2_USERNAME }}
          -Dbld.repo.rife2-snapshots.password=${{ secrets.RIFE2_PASSWORD }}
          -Dbld.repo.rife2-releases=https://repo.rife2.com/releases/
          -Dbld.repo.rife2-releases.username=${{ secrets.RIFE2_USERNAME }}
          -Dbld.repo.rife2-releases.password=${{ secrets.RIFE2_PASSWORD }}
          -Dsign.key=${{ secrets.SIGN_KEY }}
          -Dsign.passphrase=${{ secrets.SIGN_PASSPHRASE }}

      - name: Delete GnuPG data
        if: always()
        run: rm -rfv "$HOME/.gnupg"
