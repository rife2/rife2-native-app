name: WorkOrdersUI
options:
  bundleIdPrefix: com.uwyn.rife2.workorders
  deploymentTarget:
    iOS: "17.0"
targets:
  WorkOrdersUI:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Workday.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
schemes:
  WorkOrdersUI:
    build:
      targets:
        WorkOrdersUI: [test]
    test:
      targets:
        - WorkOrdersUI
